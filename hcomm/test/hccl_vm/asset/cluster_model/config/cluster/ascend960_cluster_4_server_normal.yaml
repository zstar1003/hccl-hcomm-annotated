name: "ascend960_cluster_32_server_normal"
description: "昇腾960 normal组网：32个超级节点，每个超级节点1个服务器"

# 超节点总数量
super_node_num: 2
# sever/pod总数量
server_num: 4
server_list:
  # 0-1 server: 均采用ascend960_server_topo_normal拓扑类型
  - {super_pod_id: 0, id_range: [0, 1], soc_version: "Ascend960", server_topo: "ascend960_server_topo_normal.yaml"}
  - {super_pod_id: 1, id_range: [0, 1], soc_version: "Ascend960", server_topo: "ascend960_server_topo_normal.yaml"}
